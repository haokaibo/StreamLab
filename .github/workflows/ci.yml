name: ci

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      e2e:
        description: "Also run the Docker end-to-end smoke test"
        type: boolean
        default: false

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest -q

  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config -q
      - run: docker compose --profile ui config -q

  # Manual only: needs ~8 GB RAM and pulls several images. Unverified until first run.
  e2e:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.e2e }}
    runs-on: ubuntu-latest
    needs: [python, compose-config]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e .
      - run: cp .env.example .env
      - run: docker compose up -d --build --wait
      - run: ./scripts/smoke.sh
      - if: failure()
        run: docker compose logs --no-color --tail=300
