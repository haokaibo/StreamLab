[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamlab"
version = "0.1.0"
description = "Local event-streaming practice platform: Kafka + Avro + Flink SQL + PostgreSQL + local file archive."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastavro>=1.13",
  "confluent-kafka[avro,schemaregistry]>=2.16",
  "psycopg[binary]>=3.3",
]

[project.optional-dependencies]
dev = ["pytest>=9", "ruff>=0.17", "pyyaml>=6.0.3"]

[project.scripts]
streamlab = "streamlab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
